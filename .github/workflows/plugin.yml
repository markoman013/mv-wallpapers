name: Build MV Wallpapers Plugin

# Builds the APK whenever the plugin code changes (or when run by hand from
# the Actions tab) and publishes it as a GitHub release:
#   https://github.com/markoman013/mv-wallpapers/releases/latest
# The plugin checks this release itself and offers the update.

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          # Version names: build #19 = 1.0, then 1.1, 1.2, ...
          # versionCode always grows with the run number (Android needs that for updates).
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          # Run 110 = 1.1.0, then 1.1.1, 1.1.2, …
          VERSION_NAME="1.1.$((GITHUB_RUN_NUMBER - 110))"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          bash ./gradlew :app:assembleRelease \
            -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MV_KEYSTORE_BASE64 }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          OUT="$RUNNER_TEMP/MV-Wallpapers-Plugin-v$VERSION_NAME.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias mvwallpapers \
              --ks-pass pass:mvwallpapers --key-pass pass:mvwallpapers \
              --out "$OUT" app/build/outputs/apk/release/app-release-unsigned.apk
          else
            echo "::warning::MV_KEYSTORE_BASE64 secret is missing - signing with a throwaway key. Updates will need an uninstall first."
            keytool -genkeypair -keystore "$RUNNER_TEMP/tmp.keystore" -alias tmp -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass temp123 -keypass temp123 -dname "CN=MV Wallpapers"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/tmp.keystore" --ks-key-alias tmp \
              --ks-pass pass:temp123 --key-pass pass:temp123 \
              --out "$OUT" app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          "$APKSIGNER" verify "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="plugin-v$VERSION_NAME"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --latest \
            --title "MV Wallpapers Plugin $VERSION_NAME" \
            --notes "Download **MV-Wallpapers-Plugin-v$VERSION_NAME.apk** below, or update from the plugin itself (↻ Check for updates).

          Build: $VERSION_CODE"
